# neural_path_planner 参数示例
#
# 接入 Nav2 的方式：在 nav2_params.yaml 的 planner_server 段把插件换成
#   GridBased:
#     plugin: "neural_path_planner/NeuralPathPlanner"
#     # 以下参数（前缀 GridBased.）会传给插件
#
# 三个阶段对应 backend 取值：
#   none  → 里程碑0：直线回退，验证插件能被加载、Nav2 能规划
#   onnx  → 里程碑1：ONNX Runtime CPU 推理（PC 和板子都能跑）
#   bpu   → 里程碑2：Horizon BPU runtime 推理（仅 RDK S100P）

planner_server:
  ros__parameters:
    # planner_plugins: ["GridBased"]   # 不需要改这里
    GridBased:
      plugin: "neural_path_planner/NeuralPathPlanner"

      # ---- 推理后端 ----
      # 阶段0: none   阶段1: onnx   阶段2: bpu
      backend: "none"
      # ONNX 模型路径（阶段1）或 hb_mapper 编译后的 .bin（阶段2）
      model_path: ""

      # ---- 碰撞检查 ----
      # nav2_costmap_2d 的代价刻度：0=自由, 253=INSCRIBED_INFLATED_OBSTACLE, 254=LETHAL(障碍)
      # 253 表示"紧贴障碍/在膨胀层内"也判为不可通行，较保守；想激进点可调到 254
      collision_cost_threshold: 253.0

      # ---- 直线回退参数（里程碑0 用）----
      straight_line_resolution: 0.05   # 直线插值间距(米)，与地图分辨率一致
      goal_tolerance: 0.5

      # ---- 可视化（RViz 看 /neural_path_mask，里程碑1+ 才有数据）----
      visualize: false

      # ---- 搜索窗口裁剪 (优化2) ----
      # 0=禁用。>0时先对256×256势场粗搜, 路径膨胀N格形成走廊,
      # 全分辨率gw只在走廊内搜索, 将959×1120上的gw从~45ms降到~10ms。
      corridor_width: 8
