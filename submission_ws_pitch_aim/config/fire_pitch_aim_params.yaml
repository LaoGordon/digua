fire_pitch_aim_node:
  ros__parameters:
    detections_topic: /fire/detections
    fire_class_name: fire
    min_score: 0.25
    image_height: 480
    target_y_ratio: 0.5
    deadband_px: 4.0
    release_deadband_px: 7.0
    target_timeout_sec: 0.4
    control_hz: 20.0
    up_kp_axis_per_px: 220.0
    down_kp_axis_per_px: 220.0
    up_ki_axis_per_px_sec: 18.0
    down_ki_axis_per_px_sec: 18.0
    integral_limit_px_sec: 180.0
    up_bias_axis: 4500
    down_bias_axis: 4500
    up_axis_limit: 70000
    down_axis_limit: 70000
    min_axis: 2000
    max_axis: 70000
    target_y_filter_alpha: 0.4
    invert_axis: false
    send_zero_on_target_loss: true
    log_throttle_sec: 1.0
    dog_ip: 192.168.137.120
    dog_port: 43893
    auto_stand: true
    auto_navi_mode: true
    auto_pose_mode: true
    stand_wait_sec: 8.0
    navi_wait_sec: 0.5
    pose_wait_sec: 0.5
    heartbeat_hz: 10.0
